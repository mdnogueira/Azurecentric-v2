name: Sync feeds, build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write # the sync step commits updated feed data

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync YouTube and podcast feeds
        id: sync
        run: |
          set +e
          node scripts/sync-feeds.mjs
          code=$?
          set -e
          if [ "$code" = "3" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; elif [ "$code" != "0" ]; then exit $code; fi

      - name: Commit updated feed data
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "azurecentric-bot"
          git config user.email "bot@azurecentric.com"
          git add src/data
          git commit -m "chore(feeds): sync YouTube and podcast data [skip ci]"
          git push

      - name: Build
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
