<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>Uma deteção exige responsáveis</title><rect width="1200" height="660" fill="#102738"/><rect width="1200" height="10" fill="#fb923c"/><g font-family="Arial, sans-serif"><text x="55" y="60" fill="#fbad6a" font-size="20">AZURE CENTRIC · CLOUDFLARE ACCESS</text><text x="55" y="120" fill="white" font-size="42" font-weight="700">Uma deteção exige responsáveis</text><text x="55" y="166" fill="#ccdfec" font-size="20">cloudflare_access_service_token</text><rect x="55" y="210" width="525" height="130" rx="14" fill="#1b3d53" stroke="#53849e"/><text x="79" y="255" fill="#fbad6a" font-size="23" font-weight="700">1. Deteção no GitHub</text><text x="79" y="300" fill="white" font-size="24">Alerta suportado</text><rect x="615" y="210" width="525" height="130" rx="14" fill="#1b3d53" stroke="#53849e"/><text x="639" y="255" fill="#fbad6a" font-size="23" font-weight="700">2. Responsável Cloudflare</text><text x="639" y="300" fill="white" font-size="24">Conter a credencial exposta</text><rect x="55" y="370" width="525" height="130" rx="14" fill="#1b3d53" stroke="#53849e"/><text x="79" y="415" fill="#fbad6a" font-size="23" font-weight="700">3. Responsável pelo serviço</text><text x="79" y="460" fill="white" font-size="24">Substituir e verificar</text><rect x="615" y="370" width="525" height="130" rx="14" fill="#1b3d53" stroke="#53849e"/><text x="639" y="415" fill="#fbad6a" font-size="23" font-weight="700">4. Evidência do incidente</text><text x="639" y="460" fill="white" font-size="24">Rever registos e resolver</text><text x="55" y="555" fill="#fdd6b5" font-size="22">Neste padrão: sem notificação ao parceiro, proteção de push ou validade</text><text x="55" y="615" fill="#a8c6d9" font-size="19">Fluxo de resposta proposto • Sem testes com credenciais reais</text></g></svg>