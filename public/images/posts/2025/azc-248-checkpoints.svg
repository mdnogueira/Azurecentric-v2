<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 425" role="img" aria-labelledby="t d">
<title id="t">Diagnostic Settings Flow</title>
<desc id="d">Checkpoints: Resource generates logs/metrics; Diagnostic Setting configured on Resource; Data routed to Destination (Workspace/Storage/Event Hubs); Data available for Query/Alert/Archive</desc>
<rect width="1080" height="425" rx="20" fill="#f2f6fb"/>
<style>text{font-family:Arial,sans-serif;fill:#142c4c}.heading{font-size:25px;font-weight:700}.label{font-size:23px}</style>
<text x="38" y="40" class="heading">Diagnostic Settings Flow</text>
<rect x="36" y="100" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="72" cy="134" r="20" fill="#176ea5"/><text x="65" y="142" style="font-size:23px;fill:white">1</text>
<text x="106" y="139" class="label">Resource generates</text>
<text x="106" y="168" class="label">logs/metrics</text>
<rect x="556" y="100" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="592" cy="134" r="20" fill="#176ea5"/><text x="585" y="142" style="font-size:23px;fill:white">2</text>
<text x="626" y="139" class="label">Diagnostic Setting configured</text>
<text x="626" y="168" class="label">on Resource</text>
<rect x="36" y="255" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="72" cy="289" r="20" fill="#176ea5"/><text x="65" y="297" style="font-size:23px;fill:white">3</text>
<text x="106" y="294" class="label">Data routed to Destination</text>
<text x="106" y="323" class="label">(Workspace/Storage/Event Hubs)</text>
<rect x="556" y="255" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="592" cy="289" r="20" fill="#176ea5"/><text x="585" y="297" style="font-size:23px;fill:white">4</text>
<text x="626" y="294" class="label">Data available for</text>
<text x="626" y="323" class="label">Query/Alert/Archive</text>
</svg>
