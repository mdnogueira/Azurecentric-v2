<text x="626" y="294" class="label">Validation: Boot, Connect, App</text>
<text x="626" y="323" class="label">Test</text>
<rect x="36" y="410" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
