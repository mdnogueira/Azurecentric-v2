<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" role="img" aria-labelledby="t d">
<title id="t">Private Endpoint and DNS Resolution Flow</title>
<desc id="d">Checkpoints: Client VM sends DNS query for webapp-1.azurewebsites.net; Azure DNS resolves query to private IP via linked Private DNS Zone; Private Endpoint in VNet receives traffic on private IP; Traffic routed to App Service web app via Private Link Service; App Service responds to client VM over private connection</desc>
<rect width="1080" height="580" rx="20" fill="#f2f6fb"/>
<style>text{font-family:Arial,sans-serif;fill:#142c4c}.heading{font-size:25px;font-weight:700}.label{font-size:23px}</style>
<text x="38" y="40" class="heading">Private Endpoint and DNS Resolution Flow</text>
<rect x="36" y="100" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="72" cy="134" r="20" fill="#176ea5"/><text x="65" y="142" style="font-size:23px;fill:white">1</text>
<text x="106" y="139" class="label">Client VM sends DNS query for</text>
<text x="106" y="168" class="label">webapp-1.azurewebsites.net</text>
<rect x="556" y="100" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="592" cy="134" r="20" fill="#176ea5"/><text x="585" y="142" style="font-size:23px;fill:white">2</text>
<text x="626" y="139" class="label">Azure DNS resolves query to</text>
<text x="626" y="168" class="label">private IP via linked Private</text>
<text x="626" y="197" class="label">DNS Zone</text>
<rect x="36" y="255" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="72" cy="289" r="20" fill="#176ea5"/><text x="65" y="297" style="font-size:23px;fill:white">3</text>
<text x="106" y="294" class="label">Private Endpoint in VNet</text>
<text x="106" y="323" class="label">receives traffic on private IP</text>
<rect x="556" y="255" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="592" cy="289" r="20" fill="#176ea5"/><text x="585" y="297" style="font-size:23px;fill:white">4</text>
<text x="626" y="294" class="label">Traffic routed to App Service</text>
<text x="626" y="323" class="label">web app via Private Link</text>
<text x="626" y="352" class="label">Service</text>
<rect x="36" y="410" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="72" cy="444" r="20" fill="#176ea5"/><text x="65" y="452" style="font-size:23px;fill:white">5</text>
<text x="106" y="449" class="label">App Service responds to client</text>
<text x="106" y="478" class="label">VM over private connection</text>
</svg>
