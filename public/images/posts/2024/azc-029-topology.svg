<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Explicit spoke-to-spoke routing through a hub firewall</title>
<desc id="desc">Production and test peer with the hub. Approved traffic follows a route to the hub firewall and a matching return path. Peering alone does not connect the spokes transitively.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176ea5"/></marker></defs>
<rect width="1120" height="650" rx="18" fill="#f2f6fb"/>
<style>text{font-family:Arial,sans-serif;fill:#142c4c} .head{font-size:28px;font-weight:bold}.label{font-size:23px}.small{font-size:19px}</style>
<text x="40" y="48" class="head">One hub, two spokes: define the forwarding path</text>
<rect x="340" y="85" width="440" height="240" rx="14" fill="#fff" stroke="#176ea5" stroke-width="2"/>
<text x="370" y="122" class="label">Hub: 10.10.0.0/16</text>
<rect x="390" y="153" width="340" height="125" rx="12" fill="#e4f1fc" stroke="#176ea5" stroke-width="2"/>
<text x="420" y="190" class="label">Firewall: 10.10.0.4</text>
<text x="420" y="222" class="small">Allow the approved flow</text>
<text x="420" y="250" class="small">Check both traffic directions</text>
<rect x="40" y="400" width="440" height="140" rx="14" fill="#fff" stroke="#176ea5" stroke-width="2"/>
<text x="68" y="438" class="label">Production: 10.20.0.0/16</text>
<text x="68" y="476" class="small">Route 10.30.0.0/16 to firewall</text>
<text x="68" y="508" class="small">Allow required forwarded traffic</text>
<rect x="640" y="400" width="440" height="140" rx="14" fill="#fff" stroke="#176ea5" stroke-width="2"/>
<text x="668" y="438" class="label">Test: 10.30.0.0/16</text>
<text x="668" y="476" class="small">Route 10.20.0.0/16 to firewall</text>
<text x="668" y="508" class="small">Allow required forwarded traffic</text>
<path d="M260 400L440 278" fill="none" stroke="#176ea5" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M680 278L860 400" fill="none" stroke="#176ea5" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="125" y="360" class="small">Hub peering</text><text x="867" y="360" class="small">Hub peering</text>
<text x="40" y="585" class="label">Illustrative addresses and intended inspected path</text>
<text x="40" y="618" class="small">Peering is non-transitive. Routes, forwarding settings and security rules are separate.</text>
</svg>

