<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc">
<title id="title">Applications share an App Service plan's workers</title><desc id="desc">The production app, its staging slot and a separate admin app all use the worker instances in the same plan. The plan establishes their shared compute boundary.</desc>
<rect width="1080" height="460" rx="20" fill="#f2f6fb"/>
<style>text{font-family:Arial,sans-serif;fill:#142c4c}.h{font-size:25px;font-weight:700}.b{font-size:22px}.box{fill:white;stroke:#176ea5;stroke-width:2}.line{stroke:#176ea5;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#176ea5"/></marker></defs>
<text x="40" y="48" class="h">One plan, shared worker capacity</text>
<rect class="box" x="40" y="92" width="290" height="90" rx="10"/><text x="67" y="144" class="b">Production web app</text>
<rect class="box" x="395" y="92" width="290" height="90" rx="10"/><text x="428" y="144" class="b">Staging slot</text>
<rect class="box" x="750" y="92" width="290" height="90" rx="10"/><text x="784" y="144" class="b">Admin web app</text>
<path class="line" d="M185 182 V225 H490 V270"/><path class="line" d="M540 182 V270"/><path class="line" d="M895 182 V225 H590 V270"/>
<rect x="40" y="280" width="1000" height="140" rx="14" fill="#142c4c"/>
<text x="70" y="321" style="fill:white;font-family:Arial,sans-serif;font-size:24px;font-weight:700">App Service plan</text>
<text x="70" y="360" style="fill:white;font-family:Arial,sans-serif;font-size:21px">Worker size + instance count + pricing tier</text>
<text x="70" y="393" style="fill:white;font-family:Arial,sans-serif;font-size:21px">All three consume CPU and memory from this shared pool</text>
</svg>
