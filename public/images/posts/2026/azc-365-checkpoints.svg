<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" role="img" aria-labelledby="t d">
<title id="t">Storage Failover Decision and Verification Flow</title>
<desc id="d">Checkpoints: Start: Verify Geo-Redundancy (GRS/GZRS) is enabled; Check Last Sync Time (LST) to assess data sync status; Stop all client I/O and file handles (critical for Azure Files); Initiate Failover (Planned for testing, Unplanned for outage sim); Monitor Progress via Portal/Activity Log (takes &lt;1 hour); Verify: New Primary accessible, Clients remounted, LST updated</desc>
<rect width="1080" height="580" rx="20" fill="#f2f6fb"/>
<style>text{font-family:Arial,sans-serif;fill:#142c4c}.heading{font-size:25px;font-weight:700}.label{font-size:23px}</style>
<text x="38" y="40" class="heading">Storage Failover Decision and Verification Flow</text>
<rect x="36" y="100" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="72" cy="134" r="20" fill="#176ea5"/><text x="65" y="142" style="font-size:23px;fill:white">1</text>
<text x="106" y="139" class="label">Start: Verify Geo-Redundancy</text>
<text x="106" y="168" class="label">(GRS/GZRS) is enabled</text>
<rect x="556" y="100" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="592" cy="134" r="20" fill="#176ea5"/><text x="585" y="142" style="font-size:23px;fill:white">2</text>
<text x="626" y="139" class="label">Check Last Sync Time (LST) to</text>
<text x="626" y="168" class="label">assess data sync status</text>
<rect x="36" y="255" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="72" cy="289" r="20" fill="#176ea5"/><text x="65" y="297" style="font-size:23px;fill:white">3</text>
<text x="106" y="294" class="label">Stop all client I/O and file</text>
<text x="106" y="323" class="label">handles (critical for Azure</text>
<text x="106" y="352" class="label">Files)</text>
<rect x="556" y="255" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="592" cy="289" r="20" fill="#176ea5"/><text x="585" y="297" style="font-size:23px;fill:white">4</text>
<text x="626" y="294" class="label">Initiate Failover (Planned for</text>
<text x="626" y="323" class="label">testing, Unplanned for outage</text>
<text x="626" y="352" class="label">sim)</text>
<rect x="36" y="410" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="72" cy="444" r="20" fill="#176ea5"/><text x="65" y="452" style="font-size:23px;fill:white">5</text>
<text x="106" y="449" class="label">Monitor Progress via</text>
<text x="106" y="478" class="label">Portal/Activity Log (takes &lt;1</text>
<text x="106" y="507" class="label">hour)</text>
<rect x="556" y="410" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="592" cy="444" r="20" fill="#176ea5"/><text x="585" y="452" style="font-size:23px;fill:white">6</text>
<text x="626" y="449" class="label">Verify: New Primary</text>
<text x="626" y="478" class="label">accessible, Clients remounted,</text>
<text x="626" y="507" class="label">LST updated</text>
</svg>
