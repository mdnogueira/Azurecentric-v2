<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" role="img" aria-labelledby="t d">
<title id="t">Module Version Resolution Flow</title>
<desc id="d">Checkpoints: Script calls Import-Module; Check for RequiredVersion parameter; Search PSModulePath for exact version; Load module if found; Fail if version not found; Load highest version if no pin</desc>
<rect width="1080" height="580" rx="20" fill="#f2f6fb"/>
<style>text{font-family:Arial,sans-serif;fill:#142c4c}.heading{font-size:25px;font-weight:700}.label{font-size:23px}</style>
<text x="38" y="40" class="heading">Module Version Resolution Flow</text>
<rect x="36" y="100" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="72" cy="134" r="20" fill="#176ea5"/><text x="65" y="142" style="font-size:23px;fill:white">1</text>
<text x="106" y="139" class="label">Script calls Import-Module</text>
<rect x="556" y="100" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="592" cy="134" r="20" fill="#176ea5"/><text x="585" y="142" style="font-size:23px;fill:white">2</text>
<text x="626" y="139" class="label">Check for RequiredVersion</text>
<text x="626" y="168" class="label">parameter</text>
<rect x="36" y="255" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="72" cy="289" r="20" fill="#176ea5"/><text x="65" y="297" style="font-size:23px;fill:white">3</text>
<text x="106" y="294" class="label">Search PSModulePath for exact</text>
<text x="106" y="323" class="label">version</text>
<rect x="556" y="255" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="592" cy="289" r="20" fill="#176ea5"/><text x="585" y="297" style="font-size:23px;fill:white">4</text>
<text x="626" y="294" class="label">Load module if found</text>
<rect x="36" y="410" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="72" cy="444" r="20" fill="#176ea5"/><text x="65" y="452" style="font-size:23px;fill:white">5</text>
<text x="106" y="449" class="label">Fail if version not found</text>
<rect x="556" y="410" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="592" cy="444" r="20" fill="#176ea5"/><text x="585" y="452" style="font-size:23px;fill:white">6</text>
<text x="626" y="449" class="label">Load highest version if no pin</text>
</svg>
