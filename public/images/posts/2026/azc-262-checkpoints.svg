<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" role="img" aria-labelledby="t d">
<title id="t">Azure Batch Zonal Pool Allocation Flow</title>
<desc id="d">Checkpoints: User submits pool creation request with Zonal policy; Batch service validates region and VM SKU zone support; Service checks for InfiniBand/Inter-node communication conflicts; Batch service allocates nodes across multiple Availability Zones; Pool becomes available with nodes distributed zonally</desc>
<rect width="1080" height="580" rx="20" fill="#f2f6fb"/>
<style>text{font-family:Arial,sans-serif;fill:#142c4c}.heading{font-size:25px;font-weight:700}.label{font-size:23px}</style>
<text x="38" y="40" class="heading">Azure Batch Zonal Pool Allocation Flow</text>
<rect x="36" y="100" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="72" cy="134" r="20" fill="#176ea5"/><text x="65" y="142" style="font-size:23px;fill:white">1</text>
<text x="106" y="139" class="label">User submits pool creation</text>
<text x="106" y="168" class="label">request with Zonal policy</text>
<rect x="556" y="100" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="592" cy="134" r="20" fill="#176ea5"/><text x="585" y="142" style="font-size:23px;fill:white">2</text>
<text x="626" y="139" class="label">Batch service validates region</text>
<text x="626" y="168" class="label">and VM SKU zone support</text>
<rect x="36" y="255" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="72" cy="289" r="20" fill="#176ea5"/><text x="65" y="297" style="font-size:23px;fill:white">3</text>
<text x="106" y="294" class="label">Service checks for</text>
<text x="106" y="323" class="label">InfiniBand/Inter-node</text>
<text x="106" y="352" class="label">communication conflicts</text>
<rect x="556" y="255" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="592" cy="289" r="20" fill="#176ea5"/><text x="585" y="297" style="font-size:23px;fill:white">4</text>
<text x="626" y="294" class="label">Batch service allocates nodes</text>
<text x="626" y="323" class="label">across multiple Availability</text>
<text x="626" y="352" class="label">Zones</text>
<rect x="36" y="410" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
<circle cx="72" cy="444" r="20" fill="#176ea5"/><text x="65" y="452" style="font-size:23px;fill:white">5</text>
<text x="106" y="449" class="label">Pool becomes available with</text>
<text x="106" y="478" class="label">nodes distributed zonally</text>
</svg>
