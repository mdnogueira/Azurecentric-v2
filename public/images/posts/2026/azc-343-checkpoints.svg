<circle cx="72" cy="289" r="20" fill="#176ea5"/><text x="65" y="297" style="font-size:23px;fill:white">3</text>
<text x="106" y="294" class="label">Logic Apps: Retry &amp; Error</text>
<text x="106" y="323" class="label">Handling</text>
