<text x="106" y="139" class="label">Service Bus: Active/Passive</text>
<text x="106" y="168" class="label">Replication</text>
<rect x="556" y="100" width="488" height="126" rx="12" fill="white" stroke="#176ea5" stroke-width="2"/>
