<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" role="img" aria-labelledby="t d">
<title id="t">Access Flow in Shared Sentinel Workspace</title>
<desc id="d">Checkpoints: SOC Team: Has Sentinel Contributor role on Workspace. Sees all data and Sentinel features.; Apps Team: Has Reader role on Resource Group. Sees only logs for those resources via Azure Monitor Logs.; Audit Team: Has Table-level RBAC on OfficeActivity. Sees only that specific table across the workspace.; Sentinel Workspace: Central store. Enforces access rules based on Azure RBAC and table permissions.; Non-Azure Sources: Require explicit azure_resource_id tagging to work with resource-context RBAC.</desc>
<rect width="1080" height="580" rx="20" fill="#f2f6fb"/>
