<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><rect width="1440" height="900" fill="#11293e"/><rect width="1440" height="12" fill="#3bc3ed"/><g font-family="Arial, sans-serif"><rect x="60" y="250" width="640" height="190" rx="18" fill="#1b425f" stroke="#4386a8"/><text x="88" y="298" font-size="34" fill="#ffffff" font-weight="700">1 · Requisito</text><text x="88" y="350" font-size="27" fill="#e3edf5" font-weight="400">Que decisão falta?</text><text x="88" y="390" font-size="27" fill="#e3edf5" font-weight="400">Que ativos envolve?</text><rect x="740" y="250" width="640" height="190" rx="18" fill="#1b425f" stroke="#4386a8"/><text x="768" y="298" font-size="34" fill="#ffffff" font-weight="700">2 · Cobertura</text><text x="768" y="350" font-size="27" fill="#e3edf5" font-weight="400">Cloud e recurso suportados</text><text x="768" y="390" font-size="27" fill="#e3edf5" font-weight="400">Componentes e recolha</text><rect x="60" y="480" width="640" height="190" rx="18" fill="#1b425f" stroke="#4386a8"/><text x="88" y="528" font-size="34" fill="#ffffff" font-weight="700">3 · Condições</text><text x="88" y="580" font-size="27" fill="#e3edf5" font-weight="400">Permissões e responsável</text><text x="88" y="620" font-size="27" fill="#e3edf5" font-weight="400">Âmbito, custos e retorno</text><rect x="740" y="480" width="640" height="190" rx="18" fill="#1b425f" stroke="#4386a8"/><text x="768" y="528" font-size="34" fill="#ffffff" font-weight="700">4 · Decisão</text><text x="768" y="580" font-size="27" fill="#e3edf5" font-weight="400">Evidência da fase piloto</text><text x="768" y="620" font-size="27" fill="#e3edf5" font-weight="400">Expandir ou manter em análise</text><text x="60" y="75" font-size="24" fill="#55d4f5" font-weight="400">AZURE CENTRIC · DEFENDER CSPM</text><text x="60" y="145" font-size="48" fill="#ffffff" font-weight="700">Escolher um plano CSPM</text><text x="60" y="200" font-size="29" fill="#e3edf5" font-weight="4