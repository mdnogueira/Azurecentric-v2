<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Prioritize without losing the difficult work</title><desc id="desc">Illustrative planning matrix, not Defender risk scores.</desc><rect width="1440" height="900" fill="#101f36"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="75" font-size="22" fill="#8ee0cf" font-weight="400">CLOUD SECURITY – MICROSOFT DEFENDER</text><text x="70" y="135" font-size="43" fill="#fff" font-weight="650">Prioritize without losing the difficult work</text><rect x="240" y="220" width="1080" height="530" rx="14" fill="#18344f"/><path d="M780 220V750 M240 485H1320" stroke="#65869f" stroke-width="2"/><text x="520" y="810" font-size="27" fill="#e3eef8" font-weight="400">Implementation effort →</text><text x="60" y="290" font-size="22" fill="#8ee0cf" font-weight="400">RISK</text><text x="250" y="205" font-size="21" fill="#e3eef8" font-weight="400">Lower effort</text><text x="1040" y="205" font-size="21" fill="#e3eef8" font-weight="400">Higher effort</text><text x="255" y="270" font-size="24" fill="#d3e8ec" font-weight="400">High priority</text><circle cx="290" cy="355" r="10" fill="#edb16b"/><text x="312" y="363" font-size="22" fill="#edb16b" font-weight="400">A · Review exposed access</text><circle cx="835" cy="390" r="10" fill="#f0d28d"/><text x="857" y="398" font-size="22" fill="#f0d28d" font-weight="400">B · Redesign a dependency</text><circle cx="325" cy="625" r="10" fill="#91c2dd"/><text x="347" y="633" font-size="22" fill="#91c2dd" font-weight="400">C · Adjust a secondary control</text><text x="825" y="450" font-size="21" fill="#cbdde8" font-weight="400">Keep an owner and a next decision</text><text x="70" y="870" font-size="22" fill="#a7bfd0" font-weight="400">Illustrative planning; these are not Defender scores.</text></g></svg>