<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Entrar é o início da decisão</title><desc id="desc">Regra ilustrativa: cada cliente só pode consultar os seus pedidos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8fe0cd"/></marker></defs><rect width="1440" height="960" fill="#101f36"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="65" font-size="22" fill="#8fe0cd" font-weight="400">CIBERSEGURANÇA NA PRÁTICA</text><text x="70" y="130" font-size="46" fill="white" font-weight="650">Entrar é o início da decisão</text><rect x="70" y="205" width="300" height="160" rx="18" fill="#183b50" stroke="#658da4"/><rect x="450" y="205" width="350" height="160" rx="18" fill="#183b50" stroke="#658da4"/><rect x="900" y="205" width="470" height="160" rx="18" fill="#183b50" stroke="#658da4"/><text x="95" y="265" font-size="33" fill="white" font-weight="600">Cliente A</text><text x="95" y="315" font-size="25" fill="#e2edf5" font-weight="400">Identidade declarada</text><text x="475" y="265" font-size="33" fill="white" font-weight="600">Autenticação</text><text x="475" y="315" font-size="25" fill="#e2edf5" font-weight="400">Verificar a identidade</text><text x="925" y="265" font-size="33" fill="white" font-weight="600">Autorização</text><text x="925" y="315" font-size="25" fill="#e2edf5" font-weight="400">Identidade + registo + ação</text><g fill="none" stroke="#8fe0cd" stroke-width="3" marker-end="url(#arrow)"><path d="M375 285H435"/><path d="M805 285H885"/><path d="M1135 365V410H930V450"/><path d="M1135 410H1240V450"/></g><rect x="790" y="465" width="280" height="155" rx="18" fill="#154a43" stroke="#658da4"/><rect x="1100" y="465" width="280" height="155" rx="18" fill="#51323c" stroke="#658da4"/><text x="812" y="518" font-size="25" fill="white" font-weight="600">Consultar pedido A</text><text x="812" y="578" font-size="28" fill="#9ce6ce" font-weight="650">PERMITIR</text><text x="1122" y="518" font-size="25" fill="white" font-weight="600">Consultar pedido B</text><text x="1122" y="578" font-size="28" fill="#ffb4b2" font-weight="650">RECUSAR</text><text x="70" y="420" font-size="24" fill="#bed3e3" font-weight="400">Regra ilustrativa: cada cliente só pode consultar os seus pedidos.</text><path d="M70 680H1370" stroke="#658da4" stroke-dasharray="9 9"/><rect x="70" y="725" width="600" height="105" rx="18" fill="#183b50" stroke="#658da4"/><rect x="790" y="725" width="580" height="105" rx="18" fill="#183b50" stroke="#658da4"/><text x="95" y="787" font-size="30" fill="white" font-weight="600">Identidade da aplicação do portal</text><text x="815" y="787" font-size="30" fill="white" font-weight="600">Acesso ao armazenamento</text><path d="M680 777H775" fill="none" stroke="#8fe0cd" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="895" font-size="25" fill="#bed3e3" font-weight="400">A permissão da aplicação não define o cliente que recebe o anexo.</text></g></svg>