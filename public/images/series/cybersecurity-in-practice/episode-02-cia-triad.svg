<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Three questions. The same service.</title><desc id="desc">Illustrative scenarios; not test results.</desc><rect width="1440" height="900" fill="#101f36"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="85" font-size="23" fill="#88dcc9" font-weight="400">CYBERSECURITY IN PRACTICE</text><text x="70" y="150" font-size="46" fill="#ffffff" font-weight="650">Three questions. The same service.</text><path d="M720 335 L380 640 L1060 640 Z" fill="#18344f" stroke="#528bb2" stroke-width="4"/><circle cx="720" cy="535" r="95" fill="#254b60" stroke="#79d6c0" stroke-width="3"/><text x="620" y="530" font-size="25" fill="#fff" font-weight="600">Customer portal</text><text x="665" y="566" font-size="17" fill="#afd6da" font-weight="400">EXAMPLE</text><rect x="445" y="205" width="600" height="145" rx="18" fill="#153a50" stroke="#417795"/><text x="469" y="245" font-size="31" fill="#8ee0cf" font-weight="650">Confidentiality</text><text x="469" y="283" font-size="25" fill="#e3eef8" font-weight="400">Who can read it?</text><text x="469" y="322" font-size="21" fill="#bfd1de" font-weight="400">Record disclosed to the wrong person</text><rect x="55" y="665" width="600" height="145" rx="18" fill="#153a50" stroke="#417795"/><text x="79" y="705" font-size="31" fill="#8ee0cf" font-weight="650">Integrity</text><text x="79" y="743" font-size="25" fill="#e3eef8" font-weight="400">Can we trust the record?</text><text x="79" y="782" font-size="21" fill="#bfd1de" font-weight="400">Approval changed without permission</text><rect x="780" y="665" width="600" height="145" rx="18" fill="#153a50" stroke="#417795"/><text x="804" y="705" font-size="31" fill="#8ee0cf" font-weight="650">Availability</text><text x="804" y="743" font-size="25" fill="#e3eef8" font-weight="400">Can the service be used?</text><text x="804" y="782" font-size="21" fill="#bfd1de" font-weight="400">Recovery cannot restore the service</text><text x="70" y="865" font-size="22" fill="#a7bfd0" font-weight="400">Illustrative scenarios; not test results.</text></g></svg>